version: "3.9"
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: sanketak
      POSTGRES_PASSWORD: sanketak
      POSTGRES_DB: sanketak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://sanketak:sanketak@db:5432/sanketak
      SECRET_KEY: 54627fc23d9d0fa2a4cac64905f44c58551fc0f97dd189fc4da350210acd201c
    volumes:
      - ./app:/app/app

volumes:
  pgdata: