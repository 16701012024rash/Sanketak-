# =============================================================================
# Location Registry  v0.1  — PROVISIONAL
# =============================================================================
# THIS IS NOT OIL's OFFICIAL SITE HIERARCHY.
#
# Entries below are seeded from OIL's publicly available material purely so the
# system has something to resolve against during development and demo. OIL's
# real internal structure uses its own concepts (field headquarters, production
# installations, wellhead setups, and others) and this file is expected to be
# REPLACED WHOLESALE by their site master once available.
#
# The 4-level shape (region / field / installation / area) is a normalised
# schema we chose, not a claim about how OIL organises itself. Any real
# hierarchy can be mapped onto it.
#
# `aliases` exist because reporters write the same place many ways. Resolution
# is fuzzy matching against label + aliases; on no confident match, the level
# is left null and location_raw preserves what the reporter actually wrote.
# =============================================================================

version: "0.1"
status: provisional
