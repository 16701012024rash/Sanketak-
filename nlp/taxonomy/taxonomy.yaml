# -----------------------------------------------------------------------------
# 7. EXPOSURE
# -----------------------------------------------------------------------------
# How a person was (or would be) in contact with the hazard.
# -----------------------------------------------------------------------------
exposures:
  - id: EXP_DIRECT_CONTACT
    label: "Direct contact with energy source"
  - id: EXP_PROXIMITY
    label: "In proximity / within hazard zone"
  - id: EXP_LINE_OF_FIRE
    label: "Positioned in line of fire"
  - id: EXP_ELEVATED
    label: "At elevation / unprotected edge"
  - id: EXP_ENCLOSED
    label: "Inside enclosed or confined space"
  - id: EXP_IN_TRANSIT
    label: "In a moving vehicle"
  - id: EXP_BYSTANDER
    label: "Bystander / third party in area"

# -----------------------------------------------------------------------------
# 8. POTENTIAL CONSEQUENCE
# -----------------------------------------------------------------------------
# The realistic worst credible outcome had the situation continued.
# NOTE: this is POTENTIAL, not what actually happened. That distinction is the
# whole point of SIF-precursor analysis.
# -----------------------------------------------------------------------------
consequences:
  - id: CON_FATAL_FALL
    label: "Fatal fall"
  - id: CON_STRUCK_BY
    label: "Struck by object or equipment"
  - id: CON_CAUGHT_BETWEEN
    label: "Caught in / between / crushing"
  - id: CON_ELECTROCUTION
    label: "Electrocution"
  - id: CON_ASPHYXIATION
    label: "Asphyxiation / toxic exposure"
  - id: CON_BURN
    label: "Burn / thermal injury"
  - id: CON_EXPLOSION
    label: "Fire or explosion"
  - id: CON_LOSS_OF_CONTAINMENT
    label: "Loss of containment"
  - id: CON_VEHICLE_COLLISION
    label: "Vehicle collision"
  - id: CON_DROWNING
    label: "Drowning"

# -----------------------------------------------------------------------------
# 9. SEVERITY BAND
# -----------------------------------------------------------------------------
severity_bands:
  - id: SEV_FATAL
    label: "Potentially fatal"
  - id: SEV_SERIOUS
    label: "Potentially life-altering / permanent disability"
  - id: SEV_MINOR
    label: "Minor / recoverable injury"
  - id: SEV_NO_HARM
    label: "No realistic harm potential"

# -----------------------------------------------------------------------------
# 10. CONTEXT FLAGS
# -----------------------------------------------------------------------------
# These are NOT activities. They are conditions that can apply to any activity
# and that independently raise fatal potential.
#
# SIMOPS is the clearest example: during simultaneous operations there are two
# or more activities happening at once, so it cannot be a single activity value
# without losing information. Modelling it as a flag lets a report record
# BOTH activities AND the fact that they overlapped.
#
# These flags are high-value for cross-report pattern mining: "contractor +
# night shift" recurring across sites is a systemic finding, not an incident.
# -----------------------------------------------------------------------------
context_flags:
  - id: CTX_SIMOPS
    label: "Simultaneous operations (SIMOPS)"
    note: "Two or more activities in the same area at the same time."
  - id: CTX_NIGHT_SHIFT
    label: "Night shift / low light"
  - id: CTX_CONTRACTOR
    label: "Contractor or third-party personnel"
  - id: CTX_SHUTDOWN
    label: "Shutdown / turnaround / campaign work"
  - id: CTX_ADVERSE_WEATHER
    label: "Adverse weather (monsoon, flooding, high wind, extreme heat)"
  - id: CTX_REMOTE_LOCATION
    label: "Remote location / delayed emergency response"
  - id: CTX_FIRST_TIME_TASK
    label: "Non-routine or first-time task"

# -----------------------------------------------------------------------------
# 11. LOCATION LEVELS
# -----------------------------------------------------------------------------
# NOTE: this section defines the SHAPE of a location, not the values.
# Location is the only OPEN vocabulary in this system — new wells and
# installations appear over time. Values live in `locations.yaml`, which is a
# registry, not a contract, and is intended to be replaced by OIL's real site
# master when available.
#
# EVERY LEVEL IS OPTIONAL. If a report says only "occurred at Baghewala",
# record field=... and leave the lower levels null. Do not invent depth.
# Null here means "not stated", which is different from CROSS_CUTTING above.
# -----------------------------------------------------------------------------
location_levels:
  - id: LOC_L1_REGION
    level: 1
    label: "Region / operating area"
    example: "Assam operations, Rajasthan operations"
  - id: LOC_L2_FIELD
    level: 2
    label: "Field"
    example: "Baghewala, Dandewala"
  - id: LOC_L3_INSTALLATION
    level: 3
    label: "Installation / facility"
    example: "Oil collecting station, early production setup, pump station"
  - id: LOC_L4_AREA
    level: 4
    label: "Area / unit / asset"
    example: "Wellhead, separator area, tank farm, workshop"

# Extraction contract for location:
#   location_raw   -> the verbatim text span as written by the reporter (always)
#   location_l1..4 -> resolved registry ids, or null where not stated/uncertain
# location_raw is never discarded. If resolution fails, a human can still fix it
# later and no information has been lost.
