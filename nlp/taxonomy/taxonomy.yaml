  - id: ACT_WELL_INTERVENTION
    label: "Well intervention / workover"
  - id: ACT_PRODUCTION_OPS
    label: "Production operations"
  - id: ACT_MECH_MAINTENANCE
    label: "Mechanical maintenance"
  - id: ACT_ELEC_MAINTENANCE
    label: "Electrical maintenance"
  - id: ACT_INSTRUMENT_WORK
    label: "Instrumentation work"
  - id: ACT_PIPELINE_WORK
    label: "Pipeline work"
  - id: ACT_HOT_WORK
    label: "Hot work (welding, cutting, grinding)"
  - id: ACT_LIFTING
    label: "Lifting and rigging"
  - id: ACT_CONFINED_ENTRY
    label: "Confined space entry"
  - id: ACT_WORK_AT_HEIGHT
    label: "Working at height"
  - id: ACT_EXCAVATION
    label: "Excavation / trenching"
  - id: ACT_CHEMICAL_HANDLING
    label: "Chemical handling / dosing"
  - id: ACT_TANK_VESSEL_WORK
    label: "Tank or vessel cleaning / entry prep"
  - id: ACT_CONSTRUCTION
    label: "Construction / civil work"
  - id: ACT_TRANSPORT
    label: "Transport / driving"
  - id: ACT_WELL_TESTING
    label: "Well testing"
  - id: ACT_WELLHEAD_OPS
    label: "Wellhead / Christmas-tree operations"
  - id: ACT_WIRELINE
    label: "Wireline / slickline operations"
  - id: ACT_PRESSURE_TESTING
    label: "Pressure testing"
  - id: ACT_HC_TRANSFER
